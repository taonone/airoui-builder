name: Verify common release signing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify common keystore, private-key password and certificate
        env:
          AIROUI_COMMON_SIGNING_PROFILE: ${{ secrets.AIROUI_COMMON_SIGNING_PROFILE }}
        run: python3 scripts/configure_mobile_signing.py --common --verify-env
