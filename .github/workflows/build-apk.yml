name: Airoui Android Builder

on:
  repository_dispatch:
    types: [build_apk]

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.client_payload.app_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted builder tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: python3 scripts/setup_android_sdk.py

      - name: Download and verify private project
        id: prepare
        run: python3 scripts/mobile_build.py prepare

      - name: Cache pinned Gradle dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-foundry-v3-gradle813-${{ hashFiles('foundry-work/project/**/gradle-wrapper.properties', 'foundry-work/project/**/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-foundry-v3-gradle813-

      - name: Build and verify APK or Play AAB
        id: build
        env:
          AIROUI_SIGNING_PROFILES: ${{ secrets.AIROUI_SIGNING_PROFILES }}
          AIROUI_COMMON_SIGNING_PROFILE: ${{ secrets.AIROUI_COMMON_SIGNING_PROFILE }}
          AIROUI_KEYSTORE_BASE64: ${{ secrets.AIROUI_KEYSTORE_BASE64 }}
          AIROUI_KEYSTORE_PASSWORD: ${{ secrets.AIROUI_KEYSTORE_PASSWORD }}
          AIROUI_KEY_ALIAS: ${{ secrets.AIROUI_KEY_ALIAS }}
          AIROUI_KEY_PASSWORD: ${{ secrets.AIROUI_KEY_PASSWORD }}
        run: python3 scripts/mobile_build.py build

      - name: Publish artifact or failure status, remove source
        if: ${{ always() && !cancelled() }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          BUILD_STEP_STATUS: ${{ steps.build.outcome }}
        run: python3 scripts/mobile_build.py publish
