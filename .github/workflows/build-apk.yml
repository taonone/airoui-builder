name: Airoui APK Builder
on:
  repository_dispatch:
    types: [build_apk]

# Cancel previous build for same app
concurrency:
  group: build-${{ github.event.client_payload.app_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK - ${{ github.event.client_payload.app_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (for workflow + gradlew)
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Download Source Project
        run: |
          echo "📥 Downloading: ${{ github.event.client_payload.source_url }}"
          curl -fSL "${{ github.event.client_payload.source_url }}" -o source.zip
          echo "📦 ZIP size: $(du -h source.zip | cut -f1)"

      - name: Extract & Prepare Project
        run: |
          echo "📂 Unzipping to temp folder..."
          mkdir -p temp_extract
          unzip -o source.zip -d temp_extract

          echo "🔍 Searching for build.gradle..."
          # 폴더 이름에 상관없이 진짜 프로젝트 루트(build.gradle이 있는 곳)를 찾습니다.
          ROOT_BUILD_FILE=$(find temp_extract -name "build.gradle" | head -1)

          if [ -z "$ROOT_BUILD_FILE" ]; then
            echo "❌ Error: build.gradle not found!"
            find temp_extract
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$ROOT_BUILD_FILE")
          echo "✅ Found Project Root at: $PROJECT_ROOT"

          echo "🚚 Moving files to workspace root..."
          # 찾은 폴더 안의 모든 파일(숨김 파일 포함)을 밖으로 꺼냅니다.
          shopt -s dotglob
          mv "$PROJECT_ROOT"/* .
          shopt -u dotglob

          # 임시 폴더 삭제
          rm -rf temp_extract

          echo "📂 Verifying Root Content:"
          ls -la
          
          # gradlew 실행 권한 재확인
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi
          
          # Verify project structure
          echo "=== Project Structure ==="
          find . -maxdepth 4 -not -path './.git/*' -not -path './.github/*' | head -40
          echo ""
          echo "=== settings.gradle ==="
          cat settings.gradle 2>/dev/null || echo "NOT FOUND"
          echo ""
          echo "=== app/build.gradle ==="
          cat app/build.gradle 2>/dev/null || echo "NOT FOUND"

      - name: Setup Gradle Wrapper
        run: |
          echo "⚙️ Ensuring Gradle wrapper and jar exist..."
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          echo "✅ Gradle wrapper ready"

      - name: Build Debug APK
        run: |
          echo "🔨 Building APK with Gradle..."
          ./gradlew assembleDebug --no-daemon --stacktrace
          
          # Find the output APK
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "✅ APK built: $APK_PATH"
          echo "📦 APK size: $(du -h "$APK_PATH" | cut -f1)"


      - name: Upload APK to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "📤 Uploading $APK_PATH to R2..."
          aws s3 cp "$APK_PATH" s3://airoui-files/builds/${{ github.event.client_payload.app_id }}.apk --endpoint-url ${{ secrets.R2_ENDPOINT }}

      - name: Verify Upload
        run: |
          echo "✅ APK uploaded to R2: builds/${{ github.event.client_payload.app_id }}.apk"
          echo "🎉 Build complete for: ${{ github.event.client_payload.app_name }}"



